name: Package-Build
on:
  push:
  workflow_dispatch:

jobs:
  # Not a dependency of the build: a lint failure should still leave a downloadable
  # artifact, and running the two in parallel roughly halves the wall clock.
  Lint:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Installing Node
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 22

    - name: Install deps
      run: |
        sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libsecret-1-dev
        npm i -g yarn
        cd app
        yarn
        cd ..
        rm app/node_modules/.yarn-integrity
        yarn

    - name: Build typings
      run: yarn run build:typings

    - name: Lint
      run: yarn run lint

  Windows-Build:
    runs-on: windows-2022

    env:
      # Single arch on purpose. For arm64, switch both of these to
      # aarch64-pc-windows-msvc / arm64 (or reintroduce a matrix).
      RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
      ARCH: x64
      # `zip` is what upstream ships as the portable build, and win.artifactName already
      # names it tabby-<version>-portable-x64.zip. Deliberately NOT electron-builder's
      # `portable` target: that produces a self-extracting .exe which unpacks to a temp
      # directory, so app/lib/portable.ts never finds the `data/` folder next to the
      # executable (settings would silently fall back to %APPDATA%), and it re-extracts
      # the whole app on every launch - including every `tabby telnet://...` invocation
      # that only needs to hand its arguments to the running instance.
      # `nsis` is also available, see scripts/build-windows.mjs.
      WINDOWS_TARGETS: zip
      # Fills the 4th field of the Windows FileVersion. Our version marker (M1, M2 ...)
      # lives in the patch field's text, which parseInt() drops, so without this every
      # internal revision would report the same FileVersion to Windows.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # vars.mjs derives the version from `git describe --tags`, so the tags have to
        # be present
        fetch-depth: 0

    - name: Installing Node
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 22

    - run: rustup target add ${{env.RUST_TARGET_TRIPLE}}

    - name: Update node-gyp
      run: |
        npm install --global node-gyp@10.2.0
        npm prefix -g | % {npm config set node_gyp "$_\node_modules\node-gyp\bin\node-gyp.js"}

    - name: Build
      shell: powershell
      run: |
        npm i -g yarn node-gyp
        yarn --network-timeout 1000000
        yarn run build
        node scripts/prepackage-plugins.mjs

    - name: Build portable package
      run: node scripts/build-windows.mjs

    # node-pty's native module needs the VC++ runtime. Without it Tabby shows its splash
    # screen and the terminal never loads (upstream issues #10734, #10782). The NSIS
    # installer normally pulls in vc_redist, but the portable build has no installer, so
    # the DLLs have to travel inside the archive - and an air-gapped machine cannot fetch
    # the redistributable on demand.
    - name: Add VC Runtime to portable zip
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force vc-runtime | Out-Null
        $crtDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\${{env.ARCH}}\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
          Select-Object -First 1
        if (-not $crtDir) {
          Write-Error "VC++ redistributable CRT directory not found on the runner"
          exit 1
        }
        @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") | ForEach-Object {
          $src = Join-Path $crtDir.FullName $_
          if (Test-Path $src) { Copy-Item $src vc-runtime/ } else { Write-Host "missing (skipped): $_" }
        }
        $portableZip = Get-ChildItem dist/*-portable-*.zip -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $portableZip) {
          Write-Error "No portable zip to add the VC Runtime to"
          exit 1
        }
        Add-Type -AssemblyName System.IO.Compression
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [System.IO.Compression.ZipFile]::Open($portableZip.FullName, [System.IO.Compression.ZipArchiveMode]::Update)
        Get-ChildItem vc-runtime -Filter *.dll | ForEach-Object {
          [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $_.FullName, $_.Name) | Out-Null
          Write-Host "added $($_.Name)"
        }
        $zip.Dispose()

    - name: Package artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force artifact-portable | Out-Null
        Get-ChildItem dist/*-portable-*.exe, dist/*-portable-*.zip -ErrorAction SilentlyContinue |
          Move-Item -Destination artifact-portable/
        $files = Get-ChildItem artifact-portable
        if (-not $files) {
          Write-Error "No portable artifact was produced - check the build step output"
          exit 1
        }
        $files | Select-Object -ExpandProperty Name

    - uses: actions/upload-artifact@master
      name: Upload portable build
      with:
        name: Windows portable build (${{env.ARCH}})
        path: artifact-portable
